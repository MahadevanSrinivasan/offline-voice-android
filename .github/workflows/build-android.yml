name: Build Android App

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Verify Android App
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses and Install NDK & CMake
        run: |
          SDKMANAGER=$(which sdkmanager || find /usr/local/lib/android/sdk/cmdline-tools -name "sdkmanager" | head -n 1)
          echo "Using sdkmanager at: ${SDKMANAGER}"
          yes | ${SDKMANAGER} --licenses || true
          yes | ${SDKMANAGER} "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"

      - name: Make scripts and gradlew executable
        run: |
          chmod +x gradlew scripts/fetch-assets.sh

      - name: Fetch Models and Third-Party Dependencies
        run: |
          ./scripts/fetch-assets.sh

      - name: Set up Release Keystore
        id: setup-keystore
        env:
          SECRET_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SECRET_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "${SECRET_KEYSTORE}" ]; then
            echo "Using configured repository release keystore"
            echo "${SECRET_KEYSTORE}" | base64 -d > "${GITHUB_WORKSPACE}/release-keystore.jks"
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/release-keystore.jks" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${SECRET_STORE_PASS}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${SECRET_KEY_ALIAS}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${SECRET_KEY_PASS}" >> $GITHUB_ENV
          else
            echo "Falling back to ephemeral CI release keystore"
            keytool -genkeypair -v -keystore "${GITHUB_WORKSPACE}/release-keystore.jks" \
              -alias ephemeral-release -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass ci_release_password -keypass ci_release_password \
              -dname "CN=CI Ephemeral, OU=CI, O=OfflineVoice, C=US"
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/release-keystore.jks" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=ci_release_password" >> $GITHUB_ENV
            echo "KEY_ALIAS=ephemeral-release" >> $GITHUB_ENV
            echo "KEY_PASSWORD=ci_release_password" >> $GITHUB_ENV
          fi

      - name: Run Unit Tests (testDebugUnitTest)
        run: |
          ./gradlew testDebugUnitTest --stacktrace

      - name: Compile and Sign Release APK (assembleRelease)
        run: |
          ./gradlew assembleRelease --stacktrace

      - name: Verify Signed APK with apksigner
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Found release APK: ${APK_PATH}"
          APKSIGNER=$(find $ANDROID_HOME/build-tools /usr/local/lib/android/sdk/build-tools -name "apksigner" 2>/dev/null | sort -V | tail -n 1)
          echo "Using apksigner: ${APKSIGNER}"
          ${APKSIGNER} verify --verbose "${APK_PATH}"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: offline-voice-android-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Publish GitHub Prerelease (on v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          body: |
            ## Offline Voice Android (2-Stage Offline Voice App)
            - **Stage 1 (Wakeword):** Streaming Zipformer KWS via `sherpa-onnx-2.0.2.aar` with gigaspeech int8 models
            - **Stage 2 (Transcription):** On-trigger offline transcription via `whisper.cpp` (v1.9.5) CMake JNI with `ggml-tiny.en-q5_1.bin`
            - **Target ABIs:** `armeabi-v7a` (portable `-mfpu=neon` for Fire OS 7 / Cortex-A53), `arm64-v8a`, `x86_64`
            - **Privacy:** 100% offline, Zero Google Play Services
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
